name: Airbnb Reporting

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '50 20 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py

      - name: Commit et push le fichier Excel modifié
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reporting_airbnb.xlsx
          git commit -m "Mise à jour auto reporting Airbnb - $(date)" || echo "Aucun changement"
          git push
