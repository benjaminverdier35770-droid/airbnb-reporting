name: Airbnb Competitive Reporting

on:
  workflow_dispatch:  # Permet de lancer manuellement
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 6h du matin (heure UTC)

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Apify Actor
        run: |
          curl -X POST "https://api.apify.com/v2/acts/YOUR_ACTOR_ID/run?token=${{ secrets.APIFY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"input": {"urls": ["URL_AIRBNB_1", "URL_AIRBNB_2"]}}'
